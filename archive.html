        summary: "AI 초안의 주장·숫자·날짜·출처를 분리하고 원문과 대조해 수정하는 검토표와 발행 전 확인 절차입니다.",
        link: "./posts/ai-draft-verification-workflow.html"
      },

        category: "이미지 활용",
        title: "이미지 변환 전후 용량과 품질을 비교하는 방법",
        summary: "동일한 시험 이미지의 PNG·WebP·JPG 실제 용량을 비교하고, 원본과 결과 파일로 직접 재현하는 이미지 변환 안내입니다.",
        link: "./posts/image-conversion-comparison.html"
      }
    ];

    let currentCat = 'all';

    function renderArchive(list) {
      const container = document.getElementById('archivePostList');
      const countEl = document.getElementById('archivePostCount');
      if (!container) return;

      countEl.textContent = list.length;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center bg-[#ffffff] border border-[#e2e8f0] rounded-2xl">
            <span class="text-3xl block mb-2">🔍</span>
            <p class="text-sm font-bold text-[#0f172a]">검색 결과가 없습니다.</p>
            <p class="text-xs text-[#64748b] mt-1">다른 검색어나 카테고리를 선택해 보세요.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <a class="journal-row" href="${item.link}">
          <div class="flex items-center justify-between gap-2 mb-2">
            <small class="text-xs font-semibold text-[#64748b]">${item.date}</small>
            <span class="text-xs font-bold text-[#059669] bg-[#ecfdf5] border border-[#a7f3d0] px-2.5 py-0.5 rounded-full">
              ${item.category}
            </span>
          </div>
          <h2 class="text-lg sm:text-xl font-bold text-[#0f172a] leading-snug mb-2 transition-colors">
            ${item.title}
          </h2>
          <p class="text-xs sm:text-sm text-[#475569] leading-relaxed mb-4">
            ${item.summary}
          </p>
          <div class="pt-3 border-t border-[#f1f5f9] flex items-center justify-end text-xs font-bold text-[#059669]">
            읽어보기 ↗
          </div>
        </a>
      `).join('');
    }

    function filterArchive() {
      const q = (document.getElementById('archiveSearchInput').value || '').trim().toLowerCase();
      const filtered = archiveData.filter(item => {
        const matchCat = currentCat === 'all' || item.category === currentCat;
        const matchQuery = !q || item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        return matchCat && matchQuery;
      });
      renderArchive(filtered);
    }

    document.querySelectorAll('#archiveFilterButtons .label-badge').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#archiveFilterButtons .label-badge').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.getAttribute('data-cat');
        filterArchive();
      });
    });

    document.getElementById('archiveSearchInput').addEventListener('input', filterArchive);

    renderArchive(archiveData);
  </script>
