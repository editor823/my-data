name: Daily Stock Data Auto Update

on:
  schedule:
    # 월~금 한국 시간 16:30 (장마감 후 자동 실행)
    - cron: '30 7 * * 1-5'
    # 월~금 한국 시간 08:30 (미국장 마감 후 자동 실행)
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 최신 주식 및 환율 데이터 수집
        run: node scratch/fetch_boutique.js

      - name: 최신 증시 뉴스 100건 수집 및 시드 갱신
        run: node scripts/update_live_domestic_news.js

      - name: 심플 관심종목 TV 최신 영상 브리핑 데이터 수집
        run: node scripts/update_simple_channel_briefing.js

      - name: 텔레그램 주식 브리핑 자동 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_telegram_report.js report

      - name: 변경된 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/api_result.json js/live_domestic_news_seed.js data/live_domestic_news.json data/simple_channel_briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: stock indicators, news & YouTube briefing [skip ci]" && git push)
