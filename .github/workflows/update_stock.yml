name: Daily Stock Data Auto Update

on:
  schedule:
    # 월~금 한국 시간 16:30 (장마감 후 자동 실행)
    - cron: '30 7 * * 1-5'
    # 월~금 한국 시간 08:30 (미국장 마감 후 자동 실행)
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 최신 주식 및 환율 데이터 수집
        run: node scratch/fetch_boutique.js

      - name: 변경된 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/api_result.json
          git commit -m "Auto update: 5 core market indicators [skip ci]" || exit 0
          git push
