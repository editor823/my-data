name: Daily Stock Data Auto Update

on:
  schedule:
    # 월~금 한국 시간 16:30 (장마감 후 자동 실행)
    - cron: '30 7 * * 1-5'
    # 월~금 한국 시간 08:30 (미국장 마감 후 자동 실행)
    - cron: '30 23 * * 0-4'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 시장 판도 레이더 및 5대 테마 뉴스 수집
        continue-on-error: true
        run: node scripts/update_market_overview_radar.js

      - name: 종목 심층 딥분석 11개 대장주 시세 및 공시 갱신
        continue-on-error: true
        run: node scripts/update_deep_research_live.js

      - name: 최신 증권사 리포트 25건 수집
        continue-on-error: true
        run: node scripts/update_research_reports.js

      - name: 주도 테마 타임라인 뉴스 누적 분류
        continue-on-error: true
        run: node scripts/theme_classifier.js

      - name: 캘린더 D-Day 일정 최신화
        continue-on-error: true
        run: node scripts/update_calendar_schedules_now.js

      - name: 최신 증시 뉴스 100건 수집 및 시드 갱신
        continue-on-error: true
        run: node scripts/update_live_domestic_news.js

      - name: 심플 관심종목 TV 최신 영상 브리핑 데이터 수집
        continue-on-error: true
        run: node scripts/update_simple_channel_briefing.js

      - name: 미국 11개 섹터 및 최신 시황 데이터 수집 및 갱신
        continue-on-error: true
        run: node scripts/update_us_market.js

      - name: 텔레그램 주식 브리핑 자동 발송
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send_telegram_report.js report

      - name: 변경된 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ js/ public/ stock-intelligence/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: stock indicators, news & YouTube briefing [skip ci]" && git push)
