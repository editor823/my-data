name: Daily Keyword & Trending Auto Collector (실시간 급상승어·연예뉴스·키워드 자동 갱신)

on:
  push:
    paths:
      - 'scripts/auto_collector.js'
      - '.github/workflows/daily_collector.yml'
  schedule:
    # 매일 한국시간 06:00, 12:00, 18:00, 24:00 (UTC 21:00, 03:00, 09:00, 15:00) 하루 4회 자동 실행
    - cron: '0 21,3,9,15 * * *'
  workflow_dispatch: # 관리자가 깃허브에서 수동으로 '지금 실행' 버튼을 누를 수도 있음

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 실시간 급상승어 & 연예뉴스 & 키워드센터 자동 수집 실행
        run: node scripts/auto_collector.js
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}

      - name: 증시 뉴스 시드 최신화 (js/live_domestic_news_seed.json 포함, 매일 갱신)
        run: node scripts/update_live_domestic_news.js

      - name: 변경된 키워드 및 트렌드 데이터 자동 커밋 및 배포
        run: |
          git config --global user.name 'KeywordBot'
          git config --global user.email 'bot@auto-collector.local'
          git add js/adsense.js data/trending_live.json trending_live.json data/keyword_center_live.json keyword_center_live.json data/viral_shorts_live.json viral_shorts_live.json js/live_domestic_news_seed.js js/live_domestic_news_seed.json data/live_domestic_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): live trending keywords & daily content update [skip ci]" && git push)

