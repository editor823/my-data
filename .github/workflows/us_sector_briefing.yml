name: Daily US Sector Briefing Auto Collector (매일 아침 06:40 미국 섹터 브리핑 갱신)

on:
  schedule:
    # 매일 한국시간 오전 06:40 (UTC 21:40, 미국 정규장 및 애프터마켓 마감 직후)
    - cron: '40 21 * * *'
  workflow_dispatch: # 관리자가 깃허브 Actions 탭에서 수동 실행 가능

jobs:
  collect-us-sector:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 종속성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance

      - name: 미국 11개 섹터 및 외신 브리핑 수집 스크립트 실행
        run: python scripts/fetch_us_sector.py

      - name: 수집된 브리핑 데이터 자동 커밋 및 푸시
        run: |
          git config --global user.name 'USSectorBot'
          git config --global user.email 'bot@us-sector-briefing.local'
          git add data/us_sector_briefing.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "[Auto] Update Daily US Sector Briefing Data" && git push)
